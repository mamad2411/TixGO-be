components:
    parameters:
        IdempotencyKey:
            description: 8–128 karakter; permintaan ulang dengan kunci sama mengembalikan respons yang sama.
            in: header
            name: Idempotency-Key
            required: true
            schema:
                type: string
    responses:
        Err400:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Validasi gagal (VALIDATION_FAILED)
        Err401:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Tidak terautentikasi
        Err403:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Dilarang
        Err404:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Tidak ditemukan
        Err409:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Konflik status
        Err422:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Aturan bisnis menolak
        Err429:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Terlalu banyak permintaan
    schemas:
